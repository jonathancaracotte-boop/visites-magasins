<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - Suivi des visites</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    .container {
      max-width: 460px;
      margin: 80px auto;
      padding: 30px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,.1);
      text-align: center;
    }

    h1 { color: #1d4ed8; }

    p {
      color: #6b7280;
      margin-bottom: 25px;
    }

    input, button {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border-radius: 7px;
      font-size: 16px;
    }

    input {
      border: 1px solid #d1d5db;
    }

    button {
      border: none;
      background: #1d4ed8;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #1e40af;
    }

    .demo {
      margin-top: 20px;
      padding: 12px;
      background: #eff6ff;
      border-radius: 8px;
      text-align: left;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Suivi des visites magasin</h1>
    <p>Connectez-vous à votre espace métier.</p>

    <form id="loginForm">
      <input
        type="email"
        id="email"
        placeholder="Adresse e-mail"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Mot de passe"
        required
      >

      <button type="submit">Se connecter</button>
    </form>

    <div class="demo">
      <strong>Identifiants de test :</strong><br><br>
      DR : dr@test.com / 1234<br>
      ROV : rov@test.com / 1234<br>
      RSR : rsr@test.com / 1234<br>
      RRH : rrh@test.com / 1234
    </div>
  </div>

  <script>
    const utilisateurs = {
      "dr@test.com": {
        motDePasse: "1234",
        nom: "Directeur Régional",
        role: "DR"
      },
      "rov@test.com": {
        motDePasse: "1234",
        nom: "Responsable Opérationnel Vente",
        role: "ROV"
      },
      "rsr@test.com": {
        motDePasse: "1234",
        nom: "Responsable Service et Pose",
        role: "RSR"
      },
      "rrh@test.com": {
        motDePasse: "1234",
        nom: "Responsable Ressources Humaines",
        role: "RRH"
      }
    };

    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = document.getElementById("password").value;

      const utilisateur = utilisateurs[email];

      if (!utilisateur || utilisateur.motDePasse !== password) {
        alert("Adresse e-mail ou mot de passe incorrect.");
        return;
      }

      localStorage.setItem("utilisateurConnecte", JSON.stringify({
        email: email,
        nom: utilisateur.nom,
        role: utilisateur.role
      }));

      window.location.href = "dashboard.html";
    });
  </script>
</body>
</html>
