<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suivi des visites magasin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .carte {
      width: 100%;
      max-width: 460px;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
    }

    .cache {
      display: none !important;
    }

    h1 {
      margin-top: 0;
      color: #1d4ed8;
      text-align: center;
    }

    h2 {
      color: #1d4ed8;
    }

    label {
      display: block;
      margin-top: 16px;
      font-weight: bold;
    }

    input,
    select,
    textarea,
    button {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      border-radius: 8px;
      font-size: 16px;
    }

    input,
    select,
    textarea {
      border: 1px solid #cbd5e1;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      border: none;
      background: #1d4ed8;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1e40af;
    }

    .bouton-rouge {
      background: #dc2626;
    }

    .bouton-rouge:hover {
      background: #b91c1c;
    }

    .bouton-gris {
      background: #64748b;
    }

    .message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
    }

    .erreur {
      background: #fee2e2;
      color: #991b1b;
    }

    .succes {
      background: #dcfce7;
      color: #166534;
    }

    .portail {
      min-height: 100vh;
    }

    .entete {
      background: #1d4ed8;
      color: white;
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .entete h1 {
      color: white;
      text-align: left;
      margin: 0;
    }

    .entete p {
      margin: 6px 0 0;
    }

    .entete button {
      width: auto;
      margin: 0;
    }

    .contenu {
      max-width: 1100px;
      margin: auto;
      padding: 30px;
    }

    .bloc {
      background: white;
      padding: 25px;
      margin-bottom: 25px;
      border-radius: 14px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
    }

    .tableau-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid #e2e8f0;
      text-align: left;
    }

    th {
      background: #eff6ff;
      color: #1d4ed8;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .actions button {
      flex: 1;
      min-width: 180px;
    }

    @media (max-width: 700px) {
      .entete {
        flex-direction: column;
        align-items: stretch;
      }

      .entete h1 {
        text-align: center;
      }

      .entete button {
        width: 100%;
      }

      .contenu {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

  <!-- PAGE DE CONNEXION -->
  <main id="pageConnexion" class="page">
    <section class="carte">
      <h1>Connexion</h1>

      <form id="formConnexion">
        <label for="email">Adresse e-mail</label>
        <input
          type="email"
          id="email"
          placeholder="exemple@test.com"
          required
        >

        <label for="motDePasse">Mot de passe</label>
        <input
          type="password"
          id="motDePasse"
          placeholder="Votre mot de passe"
          required
        >

        <button type="submit">Se connecter</button>
      </form>

      <div id="messageConnexion"></div>
    </section>
  </main>


  <!-- PORTAIL APRÈS CONNEXION -->
  <main id="pagePortail" class="portail cache">

    <header class="entete">
      <div>
        <h1>Suivi des visites magasin</h1>
        <p id="identiteUtilisateur"></p>
      </div>

      <button id="boutonDeconnexion" class="bouton-rouge">
        Se déconnecter
      </button>
    </header>

    <section class="contenu">

      <div class="bloc">
        <h2>Bienvenue <span id="nomUtilisateur"></span></h2>
        <p>
          Fonction : <strong id="roleUtilisateur"></strong>
        </p>
      </div>

      <div class="bloc">
        <h2>Ajouter une visite</h2>

        <form id="formVisite">

          <label for="client">Nom du client</label>
          <input
            type="text"
            id="client"
            placeholder="Nom du client"
            required
          >

          <label for="magasin">Magasin</label>
          <input
            type="text"
            id="magasin"
            value="Vichy"
            required
          >

          <label for="dateVisite">Date de la visite</label>
          <input
            type="date"
            id="dateVisite"
            required
          >

          <label for="statut">Statut</label>
          <select id="statut" required>
            <option value="">Choisir un statut</option>
            <option value="À contacter">À contacter</option>
            <option value="Rendez-vous prévu">Rendez-vous prévu</option>
            <option value="Visite réalisée">Visite réalisée</option>
            <option value="Projet en cours">Projet en cours</option>
            <option value="Terminé">Terminé</option>
          </select>

          <label for="commentaire">Commentaire</label>
          <textarea
            id="commentaire"
            placeholder="Ajouter un commentaire"
          ></textarea>

          <button type="submit">Enregistrer la visite</button>
        </form>

        <div id="messageVisite"></div>
      </div>

      <div class="bloc">
        <h2>Liste des visites</h2>

        <div class="actions">
          <button id="boutonExporter" class="bouton-gris">
            Exporter en CSV
          </button>

          <button id="boutonSupprimerTout" class="bouton-rouge">
            Supprimer toutes les visites
          </button>
        </div>

        <div class="tableau-container">
          <table>
            <thead>
              <tr>
                <th>Client</th>
                <th>Magasin</th>
                <th>Date</th>
                <th>Statut</th>
                <th>Commentaire</th>
                <th>Créée par</th>
                <th>Action</th>
              </tr>
            </thead>

            <tbody id="listeVisites"></tbody>
          </table>
        </div>
      </div>

    </section>
  </main>


  <script>
    document.addEventListener("DOMContentLoaded", function () {

      const utilisateurs = [
        {
          email: "rrh@test.com",
          motDePasse: "1234",
          nom: "RRH",
          role: "Ressources humaines"
        },
        {
          email: "dr@test.com",
          motDePasse: "1234",
          nom: "DR",
          role: "Direction régionale"
        },
        {
          email: "rov@test.com",
          motDePasse: "1234",
          nom: "ROV",
          role: "Responsable opérationnel"
        }
      ];

      let utilisateurConnecte = null;

      const pageConnexion = document.getElementById("pageConnexion");
      const pagePortail = document.getElementById("pagePortail");
      const formConnexion = document.getElementById("formConnexion");
      const messageConnexion = document.getElementById("messageConnexion");
      const boutonDeconnexion = document.getElementById("boutonDeconnexion");

      const formVisite = document.getElementById("formVisite");
      const messageVisite = document.getElementById("messageVisite");
      const listeVisites = document.getElementById("listeVisites");

      function afficherMessage(element, texte, type) {
        element.textContent = texte;
        element.className = "message " + type;
      }

      function obtenirVisites() {
        return JSON.parse(
          localStorage.getItem("visitesMagasin") || "[]"
        );
      }

      function enregistrerVisites(visites) {
        localStorage.setItem(
          "visitesMagasin",
          JSON.stringify(visites)
        );
      }

      function echapperHTML(texte) {
        return String(texte || "")
          .replace(/&/g, "&")
          .replace(/</g, "<")
          .replace(/>/g, ">")
          .replace(/"/g, """)
          .replace(/'/g, "&#039;");
      }

      function afficherVisites() {
        const visites = obtenirVisites();

        listeVisites.innerHTML = "";

        if (visites.length === 0) {
          listeVisites.innerHTML = `
            <tr>
              <td colspan="7">Aucune visite enregistrée.</td>
            </tr>
          `;
          return;
        }

        visites.forEach(function (visite, index) {
          const ligne = document.createElement("tr");

          ligne.innerHTML = `
            <td>${echapperHTML(visite.client)}</td>
            <td>${echapperHTML(visite.magasin)}</td>
            <td>${echapperHTML(visite.date)}</td>
            <td>${echapperHTML(visite.statut)}</td>
            <td>${echapperHTML(visite.commentaire)}</td>
            <td>${echapperHTML(visite.creePar)}</td>
            <td>
              <button
                class="bouton-rouge"
                onclick="supprimerVisite(${index})"
              >
                Supprimer
              </button>
            </td>
          `;

          listeVisites.appendChild(ligne);
        });
      }

      formConnexion.addEventListener("submit", function (event) {
        event.preventDefault();

        const email = document
          .getElementById("email")
          .value
          .trim()
          .toLowerCase();

        const motDePasse = document
          .getElementById("motDePasse")
          .value;

        const utilisateur = utilisateurs.find(function (compte) {
          return (
            compte.email === email &&
            compte.motDePasse === motDePasse
          );
        });

        if (!utilisateur) {
          afficherMessage(
            messageConnexion,
            "Adresse e-mail ou mot de passe incorrect.",
            "erreur"
          );
          return;
        }

        utilisateurConnecte = utilisateur;

        document.getElementById("nomUtilisateur").textContent =
          utilisateur.nom;

        document.getElementById("roleUtilisateur").textContent =
          utilisateur.role;

        document.getElementById("identiteUtilisateur").textContent =
          utilisateur.nom + " - " + utilisateur.role;

        pageConnexion.classList.add("cache");
        pagePortail.classList.remove("cache");

        formConnexion.reset();
        afficherVisites();
      });

      boutonDeconnexion.addEventListener("click", function () {
        utilisateurConnecte = null;

        pagePortail.classList.add("cache");
        pageConnexion.classList.remove("cache");

        messageConnexion.textContent = "";
        messageConnexion.className = "";
      });

      formVisite.addEventListener("submit", function (event) {
        event.preventDefault();

        if (!utilisateurConnecte) {
          return;
        }

        const nouvelleVisite = {
          client: document.getElementById("client").value.trim(),
          magasin: document.getElementById("magasin").value.trim(),
          date: document.getElementById("dateVisite").value,
          statut: document.getElementById("statut").value,
          commentaire: document
            .getElementById("commentaire")
            .value
            .trim(),
          creePar: utilisateurConnecte.email
        };

        const visites = obtenirVisites();
        visites.push(nouvelleVisite);
        enregistrerVisites(visites);

        formVisite.reset();
        document.getElementById("magasin").value = "Vichy";

        afficherMessage(
          messageVisite,
          "La visite a bien été enregistrée.",
          "succes"
        );

        afficherVisites();
      });

      document
        .getElementById("boutonSupprimerTout")
        .addEventListener("click", function () {
          const visites = obtenirVisites();

          if (visites.length === 0) {
            alert("Aucune visite à supprimer.");
            return;
          }

          if (
            confirm(
              "Voulez-vous vraiment supprimer toutes les visites ?"
            )
          ) {
            localStorage.removeItem("visitesMagasin");
            afficherVisites();
          }
        });

      document
        .getElementById("boutonExporter")
        .addEventListener("click", function () {
          const visites = obtenirVisites();

          if (visites.length === 0) {
            alert("Aucune visite à exporter.");
            return;
          }

          const entetes = [
            "Client",
            "Magasin",
            "Date",
            "Statut",
            "Commentaire",
            "Créée par"
          ];

          const lignes = visites.map(function (visite) {
            return [
              visite.client,
              visite.magasin,
              visite.date,
              visite.statut,
              visite.commentaire,
              visite.creePar
            ];
          });

          const contenuCSV = [entetes, ...lignes]
            .map(function (ligne) {
              return ligne
                .map(function (cellule) {
                  return '"' +
                    String(cellule || "")
                      .replace(/"/g, '""') +
                    '"';
                })
                .join(";");
            })
            .join("\n");

          const fichier = new Blob(
            ["\ufeff" + contenuCSV],
            { type: "text/csv;charset=utf-8;" }
          );

          const url = URL.createObjectURL(fichier);
          const lien = document.createElement("a");

          lien.href = url;
          lien.download = "visites-magasin.csv";
          document.body.appendChild(lien);
          lien.click();
          document.body.removeChild(lien);

          URL.revokeObjectURL(url);
        });

      window.supprimerVisite = function (index) {
        const visites = obtenirVisites();

        if (confirm("Supprimer cette visite ?")) {
          visites.splice(index, 1);
          enregistrerVisites(visites);
          afficherVisites();
        }
      };

    });
  </script>

</body>
</html>
