<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suivi des visites magasin</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    .container {
      max-width: 500px;
      margin: 80px auto;
      padding: 30px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    h1 {
      color: #1d4ed8;
      margin-bottom: 10px;
    }

    p {
      color: #6b7280;
      margin-bottom: 30px;
    }

    input {
      width: 90%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      width: 95%;
      padding: 12px;
      margin-top: 15px;
      background: #1d4ed8;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1e40af;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Suivi des visites magasin</h1>
    <p>Connectez-vous pour accéder à votre espace.</p>

    <form id="loginForm">
      <input
        type="email"
        id="email"
        placeholder="Adresse e-mail"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Mot de passe"
        required
      >

      <button type="submit">Se connecter</button>
    </form>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      if (email === "admin@test.com" && password === "1234") {
        window.location.href = "dashboard.html";
      } else {
        alert("Adresse e-mail ou mot de passe incorrect.");
      }
    });
  </script>
</body>
</html>
