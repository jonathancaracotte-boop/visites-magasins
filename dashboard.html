<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tableau de bord - Visites magasin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    header {
      background: #2453d4;
      color: white;
      padding: 20px;
    }

    .header-content {
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 6px 0 0;
      color: #e5e7eb;
    }

    .btn-deconnexion {
      width: auto;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      background: #dc2626;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-deconnexion:hover {
      background: #b91c1c;
    }

    .container {
      width: 92%;
      max-width: 1200px;
      margin: 25px auto;
    }

    .cartes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .carte {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .carte h3 {
      margin: 0 0 10px;
      color: #6b7280;
      font-size: 15px;
    }

    .carte strong {
      font-size: 30px;
      color: #2453d4;
    }

    .bloc {
      background: white;
      padding: 25px;
      margin-bottom: 25px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .bloc h2 {
      margin-top: 0;
      color: #2453d4;
    }

    .grille {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select,
    textarea,
    button {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      font-size: 15px;
    }

    input,
    select,
    textarea {
      border: 1px solid #cbd5e1;
      background: white;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .champ-complet {
      grid-column: 1 / -1;
    }

    .btn-enregistrer {
      margin-top: 18px;
      border: none;
      background: #16a34a;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-enregistrer:hover {
      background: #15803d;
    }

    .visite {
      border-left: 5px solid #2453d4;
      background: #f8fafc;
      padding: 15px;
      margin-bottom: 12px;
      border-radius: 6px;
      line-height: 1.7;
    }

    .aucune {
      color: #6b7280;
      font-style: italic;
    }

    @media (max-width: 600px) {
      .header-content {
        flex-direction: column;
        align-items: stretch;
      }

      header h1 {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="header-content">
      <div>
        <h1>Suivi des visites magasin</h1>
        <p id="utilisateurConnecte"></p>
      </div>

      <button
        class="btn-deconnexion"
        onclick="deconnexion()"
      >
        Se déconnecter
      </button>
    </div>
  </header>

  <main class="container">

    <section class="cartes">
      <div class="carte">
        <h3>Total des visites</h3>
        <strong id="nombreVisites">0</strong>
      </div>

      <div class="carte">
        <h3>Visites terminées</h3>
        <strong id="visitesTerminees">0</strong>
      </div>

      <div class="carte">
        <h3>Visites à corriger</h3>
        <strong id="visitesCorriger">0</strong>
      </div>
    </section>

    <section class="bloc">
      <h2>Enregistrer une visite</h2>

      <form id="visiteForm">

        <div class="grille">
          <div>
            <label for="magasin">Magasin</label>
            <select id="magasin" required>
              <option value="">Sélectionner un magasin</option>
            </select>
          </div>

          <div>
            <label for="date">Date de la visite</label>
            <input type="date" id="date" required>
          </div>

          <div>
            <label for="typeVisite">Type de visite</label>
            <select id="typeVisite" required>
              <option value="">Sélectionner un type</option>
              <option value="Visite magasin">Visite magasin</option>
              <option value="Visite sécurité">Visite sécurité</option>
              <option value="Visite commerciale">Visite commerciale</option>
              <option value="Visite chantier">Visite chantier</option>
              <option value="Autre">Autre</option>
            </select>
          </div>

          <div>
            <label for="statut">Statut</label>
            <select id="statut" required>
              <option value="">Sélectionner un statut</option>
              <option value="Terminée">Terminée</option>
              <option value="Validée">Validée</option>
              <option value="À corriger">À corriger</option>
              <option value="En cours">En cours</option>
            </select>
          </div>

          <div class="champ-complet">
            <label for="commentaire">Commentaire</label>
            <textarea
              id="commentaire"
              placeholder="Ajouter un commentaire..."
            ></textarea>
          </div>
        </div>

        <button
          type="submit"
          class="btn-enregistrer"
        >
          Enregistrer la visite
        </button>

      </form>
    </section>

    <section class="bloc">
      <h2>Historique des visites</h2>
      <div id="listeVisites"></div>
    </section>

  </main>

  <script>
    const magasins = [
      { code: "005", nom: "CHERBOURG" },
      { code: "008", nom: "TOURS CHAMBRAY II" },
      { code: "009", nom: "CHANTEPIE" },
      { code: "012", nom: "ANGERS" },
      { code: "023", nom: "VINEUIL" },
      { code: "028", nom: "ST ET.D.ROUVRAY" },
      { code: "051", nom: "ORLEANS SARAN" },
      { code: "053", nom: "LANESTER" },
      { code: "087", nom: "VANNES PLOEREN" },
      { code: "095", nom: "MONTGERMONT" },
      { code: "098", nom: "LAVAL" },
      { code: "100", nom: "QUIMPER" },
      { code: "106", nom: "BARENTIN" },
      { code: "121", nom: "MONDEVILLE ETOILE" },
      { code: "123", nom: "LANGUEUX" },
      { code: "139", nom: "LE MANS-CLEMENCEAU" },
      { code: "159", nom: "GONFREVILLE" },
      { code: "173", nom: "BREST GOUESNOU" },
      { code: "188", nom: "CHARTRES" },
      { code: "201", nom: "DIEPPE" },
      { code: "217", nom: "LANNION" },
      { code: "218", nom: "ST MALO" },
      { code: "222", nom: "EVREUX" },
      { code: "237", nom: "ORLEANS" }
    ];

    const utilisateur = JSON.parse(
      localStorage.getItem("utilisateurConnecte")
    );

    if (!utilisateur) {
      window.location.href = "index.html";
    }

    document.getElementById("utilisateurConnecte").textContent =
      utilisateur.nom + " - rôle : " + utilisateur.role;

    const selectMagasin = document.getElementById("magasin");

    magasins.forEach(function(magasin) {
      const option = document.createElement("option");

      option.value = magasin.code;
      option.textContent =
        magasin.code + " - " + magasin.nom;

      selectMagasin.appendChild(option);
    });

    document.getElementById("date").value =
      new Date().toISOString().split("T")[0];

    function recupererVisites() {
      return JSON.parse(
        localStorage.getItem("visitesMagasins") || "[]"
      );
    }

    function afficherVisites() {
      const toutesLesVisites = recupererVisites();

      const visites = utilisateur.role === "DR"
        ? toutesLesVisites
        : toutesLesVisites.filter(function(visite) {
            return visite.role === utilisateur.role;
          });

      document.getElementById("nombreVisites").textContent =
        visites.length;

      document.getElementById("visitesTerminees").textContent =
        visites.filter(function(visite) {
          return visite.statut === "Terminée" ||
                 visite.statut === "Validée";
        }).length;

      document.getElementById("visitesCorriger").textContent =
        visites.filter(function(visite) {
          return visite.statut === "À corriger";
        }).length;

      const liste = document.getElementById("listeVisites");

      if (visites.length === 0) {
        liste.innerHTML =
          '<p class="aucune">Aucune visite enregistrée.</p>';
        return;
      }

      liste.innerHTML = "";

      visites
        .slice()
        .reverse()
        .forEach(function(visite) {
          const magasin = magasins.find(function(item) {
            return item.code === visite.magasin;
          });

          const nomMagasin = magasin
            ? magasin.code + " - " + magasin.nom
            : visite.magasin;

          liste.innerHTML += `
            <article class="visite">
              <strong>${visite.type}</strong><br>
              <b>Magasin :</b> ${nomMagasin}<br>
              <b>Date :</b> ${visite.date}<br>
              <b>Statut :</b> ${visite.statut}<br>
              <b>Auteur :</b> ${visite.auteur}<br>
              <b>Commentaire :</b>
              ${visite.commentaire || "Aucun commentaire"}
            </article>
          `;
        });
    }

    document
      .getElementById("visiteForm")
      .addEventListener("submit", function(event) {
        event.preventDefault();

        const visites = recupererVisites();

        visites.push({
          magasin: document.getElementById("magasin").value,
          date: document.getElementById("date").value,
          type: document.getElementById("typeVisite").value,
          statut: document.getElementById("statut").value,
          commentaire: document.getElementById("commentaire").value,
          role: utilisateur.role,
          auteur: utilisateur.nom
        });

        localStorage.setItem(
          "visitesMagasins",
          JSON.stringify(visites)
        );

        alert("La visite a bien été enregistrée.");

        document.getElementById("visiteForm").reset();
        document.getElementById("date").value =
          new Date().toISOString().split("T")[0];

        afficherVisites();
      });

    function deconnexion() {
      localStorage.removeItem("utilisateurConnecte");
      window.location.href = "index.html";
    }

    afficherVisites();
  </script>

</body>
</html>
