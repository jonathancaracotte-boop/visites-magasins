<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tableau de bord - Visites magasin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    header {
      background: #2453d4;
      color: white;
      padding: 20px;
    }

    .header-content,
    .container {
      width: 92%;
      max-width: 1200px;
      margin: auto;
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 6px 0 0;
      color: #e5e7eb;
    }

    button {
      cursor: pointer;
      font-weight: bold;
    }

    .btn-deconnexion {
      width: auto;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      background: #dc2626;
      color: white;
    }

    .container {
      margin-top: 25px;
    }

    .cartes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .carte,
    .bloc {
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .carte {
      padding: 20px;
      text-align: center;
    }

    .carte h3 {
      margin: 0 0 10px;
      color: #6b7280;
      font-size: 15px;
    }

    .carte strong {
      font-size: 30px;
      color: #2453d4;
    }

    .bloc {
      padding: 25px;
      margin-bottom: 25px;
    }

    .bloc h2 {
      margin-top: 0;
      color: #2453d4;
    }

    .grille {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select,
    textarea,
    button {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      font-size: 15px;
    }

    input,
    select,
    textarea {
      border: 1px solid #cbd5e1;
      background: white;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .champ-complet {
      grid-column: 1 / -1;
    }

    .indicateurs {
      grid-column: 1 / -1;
      margin-top: 10px;
      padding: 18px;
      background: #f8fafc;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }

    .indicateur {
      display: grid;
      grid-template-columns: 1fr 180px 100px;
      gap: 10px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .indicateur:last-child {
      border-bottom: none;
    }

    .indicateur label {
      margin: 0;
    }

    .conformite-apercu {
      margin-top: 15px;
      padding: 14px;
      background: #dbeafe;
      color: #1e40af;
      border-radius: 7px;
      font-weight: bold;
      text-align: center;
    }

    .btn-enregistrer {
      margin-top: 18px;
      border: none;
      background: #16a34a;
      color: white;
    }

    .visite {
      border-left: 5px solid #2453d4;
      background: #f8fafc;
      padding: 15px;
      margin-bottom: 12px;
      border-radius: 6px;
      line-height: 1.7;
    }

    .note {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 5px;
      background: #16a34a;
      color: white;
      font-weight: bold;
    }

    .aucune {
      color: #6b7280;
      font-style: italic;
    }

    @media (max-width: 700px) {
      .header-content {
        flex-direction: column;
        align-items: stretch;
      }

      .indicateur {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-content">
    <div>
      <h1>Suivi des visites magasin</h1>
      <p id="utilisateurConnecte"></p>
    </div>

    <button class="btn-deconnexion" onclick="deconnexion()">
      Se déconnecter
    </button>
  </div>
</header>

<main class="container">

  <section class="cartes">
    <div class="carte">
      <h3>Total des visites</h3>
      <strong id="nombreVisites">0</strong>
    </div>

    <div class="carte">
      <h3>Visites terminées</h3>
      <strong id="visitesTerminees">0</strong>
    </div>

    <div class="carte">
      <h3>Visites à corriger</h3>
      <strong id="visitesCorriger">0</strong>
    </div>

    <div class="carte">
      <h3>Conformité moyenne</h3>
      <strong id="conformiteMoyenne">-</strong>
    </div>
  </section>

  <section class="bloc">
    <h2>Enregistrer une visite</h2>

    <form id="visiteForm">

      <div class="grille">

        <div>
          <label for="magasin">Magasin</label>
          <select id="magasin" required>
            <option value="">Sélectionner un magasin</option>
          </select>
        </div>

        <div>
          <label for="date">Date de la visite</label>
          <input type="date" id="date" required>
        </div>

        <div>
          <label for="typeVisite">Type de visite</label>
          <select id="typeVisite" required>
            <option value="">Sélectionner un type</option>
            <option>Visite magasin</option>
            <option>Visite sécurité</option>
            <option>Visite commerciale</option>
            <option>Visite chantier</option>
            <option>Autre</option>
          </select>
        </div>

        <div>
          <label for="statut">Statut</label>
          <select id="statut" required>
            <option value="">Sélectionner un statut</option>
            <option>Terminée</option>
            <option>Validée</option>
            <option>À corriger</option>
            <option>En cours</option>
          </select>
        </div>

        <div class="indicateurs">
          <h3>Évaluation de conformité</h3>

          <div class="indicateur">
            <label for="indicateur1">Accueil client</label>
            <select id="indicateur1">
              <option value="">Non évalué</option>
              <option value="Conforme">Conforme</option>
              <option value="Non conforme">Non conforme</option>
              <option value="Non applicable">Non applicable</option>
            </select>
            <input type="number" id="points1" value="1" min="0">
          </div>

          <div class="indicateur">
            <label for="indicateur2">Tenue du magasin</label>
            <select id="indicateur2">
              <option value="">Non évalué</option>
              <option value="Conforme">Conforme</option>
              <option value="Non conforme">Non conforme</option>
              <option value="Non applicable">Non applicable</option>
            </select>
            <input type="number" id="points2" value="1" min="0">
          </div>

          <div class="indicateur">
            <label for="indicateur3">Affichage obligatoire</label>
            <select id="indicateur3">
              <option value="">Non évalué</option>
              <option value="Conforme">Conforme</option>
              <option value="Non conforme">Non conforme</option>
              <option value="Non applicable">Non applicable</option>
            </select>
            <input type="number" id="points3" value="1" min="0">
          </div>

          <div class="indicateur">
            <label for="indicateur4">Sécurité du magasin</label>
            <select id="indicateur4">
              <option value="">Non évalué</option>
              <option value="Conforme">Conforme</option>
              <option value="Non conforme">Non conforme</option>
              <option value="Non applicable">Non applicable</option>
            </select>
            <input type="number" id="points4" value="1" min="0">
          </div>

          <div class="indicateur">
            <label for="indicateur5">Respect des procédures</label>
            <select id="indicateur5">
              <option value="">Non évalué</option>
              <option value="Conforme">Conforme</option>
              <option value="Non conforme">Non conforme</option>
              <option value="Non applicable">Non applicable</option>
            </select>
            <input type="number" id="points5" value="1" min="0">
          </div>

          <div class="conformite-apercu">
            Conformité calculée :
            <span id="conformiteApercu">-</span>
          </div>
        </div>

        <div class="champ-complet">
          <label for="commentaire">Commentaire</label>
          <textarea id="commentaire" placeholder="Ajouter un commentaire..."></textarea>
        </div>

      </div>

      <button type="submit" class="btn-enregistrer">
        Enregistrer la visite
      </button>

    </form>
  </section>

  <section class="bloc">
    <h2>Historique des visites</h2>
    <div id="listeVisites"></div>
  </section>

</main>

<script>
  const magasins = [
    { code: "005", nom: "CHERBOURG" },
    { code: "008", nom: "TOURS CHAMBRAY II" },
    { code: "009", nom: "CHANTEPIE" },
    { code: "012", nom: "ANGERS" },
    { code: "023", nom: "VINEUIL" },
    { code: "028", nom: "ST ET.D.ROUVRAY" },
    { code: "051", nom: "ORLEANS SARAN" },
    { code: "053", nom: "LANESTER" },
    { code: "087", nom: "VANNES PLOEREN" },
    { code: "095", nom: "MONTGERMONT" },
    { code: "098", nom: "LAVAL" },
    { code: "100", nom: "QUIMPER" },
    { code: "106", nom: "BARENTIN" },
    { code: "121", nom: "MONDEVILLE ETOILE" },
    { code: "123", nom: "LANGUEUX" },
    { code: "139", nom: "LE MANS-CLEMENCEAU" },
    { code: "159", nom: "GONFREVILLE" },
    { code: "173", nom: "BREST GOUESNOU" },
    { code: "188", nom: "CHARTRES" },
    { code: "201", nom: "DIEPPE" },
    { code: "217", nom: "LANNION" },
    { code: "218", nom: "ST MALO" },
    { code: "222", nom: "EVREUX" },
    { code: "237", nom: "ORLEANS" }
  ];

  const utilisateur = JSON.parse(
    localStorage.getItem("utilisateurConnecte")
  );

  if (!utilisateur) {
    window.location.href = "index.html";
  }

  document.getElementById("utilisateurConnecte").textContent =
    utilisateur.nom + " - rôle : " + utilisateur.role;

  magasins.forEach(function(magasin) {
    const option = document.createElement("option");
    option.value = magasin.code;
    option.textContent = magasin.code + " - " + magasin.nom;
    document.getElementById("magasin").appendChild(option);
  });

  document.getElementById("date").value =
    new Date().toISOString().split("T")[0];

  function recupererVisites() {
    return JSON.parse(
      localStorage.getItem("visitesMagasins") || "[]"
    );
  }

  function recupererIndicateurs() {
    const indicateurs = [];

    for (let i = 1; i <= 5; i++) {
      const reponse = document.getElementById("indicateur" + i).value;
      const points = Number(
        document.getElementById("points" + i).value
      ) || 0;

      if (reponse !== "") {
        indicateurs.push({
          question: document
            .querySelector("#indicateur" + i)
            .previousElementSibling.textContent,
          reponse: reponse,
          points: points
        });
      }
    }

    return indicateurs;
  }

  function calculerConformite(indicateurs) {
    let pointsConformes = 0;
    let pointsEvalues = 0;

    indicateurs.forEach(function(indicateur) {
      if (indicateur.reponse === "Non applicable") {
        return;
      }

      pointsEvalues += Number(indicateur.points) || 0;

      if (indicateur.reponse === "Conforme") {
        pointsConformes += Number(indicateur.points) || 0;
      }
    });

    if (pointsEvalues === 0) {
      return null;
    }

    return Math.round(
      (pointsConformes / pointsEvalues) * 100
    );
  }

  function afficherConformiteApercu() {
    const indicateurs = recupererIndicateurs();
    const conformite = calculerConformite(indicateurs);

    document.getElementById("conformiteApercu").textContent =
      conformite === null ? "-" : conformite + " %";
  }

  document.querySelectorAll(".indicateurs select, .indicateurs input")
    .forEach(function(element) {
      element.addEventListener("change", afficherConformiteApercu);
      element.addEventListener("input", afficherConformiteApercu);
    });

  function afficherVisites() {
    const toutesLesVisites = recupererVisites();

    const visites = utilisateur.role === "DR"
      ? toutesLesVisites
      : toutesLesVisites.filter(function(visite) {
          return visite.role === utilisateur.role;
        });

    document.getElementById("nombreVisites").textContent =
      visites.length;

    document.getElementById("visitesTerminees").textContent =
      visites.filter(function(visite) {
        return visite.statut === "Terminée" ||
               visite.statut === "Validée";
      }).length;

    document.getElementById("visitesCorriger").textContent =
      visites.filter(function(visite) {
        return visite.statut === "À corriger";
      }).length;

    const conformites = visites
      .map(function(visite) {
        return visite.conformite;
      })
      .filter(function(note) {
        return note !== null && note !== undefined;
      });

    const moyenne = conformites.length
      ? Math.round(
          conformites.reduce(function(total, note) {
            return total + note;
          }, 0) / conformites.length
        )
      : null;

    document.getElementById("conformiteMoyenne").textContent =
      moyenne === null ? "-" : moyenne + " %";

    const liste = document.getElementById("listeVisites");

    if (visites.length === 0) {
      liste.innerHTML =
        '<p class="aucune">Aucune visite enregistrée.</p>';
      return;
    }

    liste.innerHTML = "";

    visites.slice().reverse().forEach(function(visite) {
      const magasin = magasins.find(function(item) {
        return item.code === visite.magasin;
      });

      const nomMagasin = magasin
        ? magasin.code + " - " + magasin.nom
        : visite.magasin;

      const conformite = visite.conformite === null ||
        visite.conformite === undefined
        ? "Non calculée"
        : visite.conformite + " %";

      liste.innerHTML += `
        <article class="visite">
          <strong>${visite.type}</strong><br>
          <b>Magasin :</b> ${nomMagasin}<br>
          <b>Date :</b> ${visite.date}<br>
          <b>Statut :</b> ${visite.statut}<br>
          <b>Conformité :</b>
          <span class="note">${conformite}</span><br>
          <b>Auteur :</b> ${visite.auteur}<br>
          <b>Commentaire :</b>
          ${visite.commentaire || "Aucun commentaire"}
        </article>
      `;
    });
  }

  document.getElementById("visiteForm")
    .addEventListener("submit", function(event) {
      event.preventDefault();

      const indicateurs = recupererIndicateurs();
      const conformite = calculerConformite(indicateurs);

      const visites = recupererVisites();

      visites.push({
        magasin: document.getElementById("magasin").value,
        date: document.getElementById("date").value,
        type: document.getElementById("typeVisite").value,
        statut: document.getElementById("statut").value,
        commentaire: document.getElementById("commentaire").value,
        indicateurs: indicateurs,
        conformite: conformite,
        role: utilisateur.role,
        auteur: utilisateur.nom
      });

      localStorage.setItem(
        "visitesMagasins",
        JSON.stringify(visites)
      );

      alert("La visite a bien été enregistrée.");

      document.getElementById("visiteForm").reset();

      document.getElementById("date").value =
        new Date().toISOString().split("T")[0];

      document.getElementById("conformiteApercu").textContent = "-";

      afficherVisites();
    });

  function deconnexion() {
    localStorage.removeItem("utilisateurConnecte");
    window.location.href = "index.html";
  }

  afficherVisites();
</script>

</body>
</html>
