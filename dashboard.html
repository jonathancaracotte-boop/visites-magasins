<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tableau de bord</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    header {
      background: #1d4ed8;
      color: white;
      padding: 20px;
    }

    header .top {
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    header h1 {
      margin: 0 0 6px;
    }

    header p {
      margin: 0;
    }

    main {
      max-width: 1200px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      padding: 22px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, .08);
    }

    h2 {
      color: #1d4ed8;
      border-bottom: 2px solid #e5e7eb;
      padding-bottom: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 15px;
    }

    .indicator {
      padding: 20px;
      border-radius: 10px;
      background: #eff6ff;
      border-left: 5px solid #1d4ed8;
    }

    .indicator strong {
      display: block;
      font-size: 30px;
      color: #1d4ed8;
      margin-top: 8px;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 7px;
      background: #1d4ed8;
      color: white;
      font-size: 15px;
      cursor: pointer;
      margin: 5px;
    }

    button:hover {
      opacity: .9;
    }

    .secondary {
      background: #6b7280;
    }

    .danger {
      background: #dc2626;
    }

    .success {
      background: #16a34a;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 15px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .controle {
      display: grid;
      grid-template-columns: 2fr 180px 3fr;
      gap: 12px;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .controle:last-child {
      border-bottom: none;
    }

    .evaluation {
      font-weight: bold;
      transition: .2s;
    }

    .evaluation-ok {
      background: #dcfce7;
      color: #166534;
      border-color: #22c55e;
    }

    .evaluation-partiel {
      background: #ffedd5;
      color: #9a3412;
      border-color: #f97316;
    }

    .evaluation-non {
      background: #fee2e2;
      color: #991b1b;
      border-color: #ef4444;
    }

    .evaluation-ne {
      background: #e5e7eb;
      color: #374151;
      border-color: #9ca3af;
    }

    .resultat {
      background: #eff6ff;
      border: 1px solid #93c5fd;
      padding: 18px;
      border-radius: 8px;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 15px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    #pageVisite {
      display: none;
    }

    .visite-liste {
      padding: 12px;
      margin: 8px 0;
      background: #f9fafb;
      border-left: 4px solid #1d4ed8;
      border-radius: 5px;
      line-height: 1.6;
    }

    .badge {
      display: inline-block;
      padding: 4px 9px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 13px;
    }

    .badge-ok {
      background: #dcfce7;
      color: #166534;
    }

    .badge-partiel {
      background: #ffedd5;
      color: #9a3412;
    }

    .badge-non {
      background: #fee2e2;
      color: #991b1b;
    }

    .badge-ne {
      background: #e5e7eb;
      color: #374151;
    }

    .aucune {
      color: #6b7280;
    }

    @media (max-width: 700px) {
      header .top {
        flex-direction: column;
        align-items: flex-start;
      }

      .controle {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="top">
    <div>
      <h1 id="titrePage">Tableau de bord</h1>
      <p id="utilisateurConnecte"></p>
    </div>

    <button class="danger" onclick="deconnexion()">
      Se déconnecter
    </button>
  </div>
</header>

<main>

  <section id="pageDashboard">

    <div class="card">
      <h2 id="titreDashboard">Mon tableau de bord</h2>

      <div class="grid">
        <div class="indicator">
          Nombre de visites
          <strong id="nombreVisites">0</strong>
        </div>

        <div class="indicator">
          Visites terminées
          <strong id="visitesTerminees">0</strong>
        </div>

        <div class="indicator">
          Anomalies à corriger
          <strong id="anomalies">0</strong>
        </div>

        <div class="indicator">
          Taux de conformité
          <strong id="tauxGlobal">0 %</strong>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Actions</h2>

      <button type="button" onclick="afficherPageVisite()">
        + Créer une visite
      </button>

      <button
        type="button"
        class="secondary"
        onclick="actualiserDashboard()"
      >
        Actualiser
      </button>
    </div>

    <div class="card">
      <h2>Dernières visites</h2>

      <div id="listeVisites">
        Aucune visite enregistrée.
      </div>
    </div>

  </section>

  <section id="pageVisite">

    <div class="card">
      <h2 id="titreVisite">Créer une visite</h2>

      <form id="visiteForm">

        <div class="grid">

          <div>
            <label for="magasin">Magasin</label>
            <select id="magasin" required></select>
          </div>

          <div>
            <label for="date">Date de visite</label>
            <input type="date" id="date" required>
          </div>

          <div>
            <label for="responsable">Responsable de magasin</label>
            <input type="text" id="responsable">
          </div>

          <div>
            <label for="visiteur">Visiteur</label>
            <input type="text" id="visiteur">
          </div>

          <div>
            <label for="statut">Statut</label>

            <select id="statut">
              <option>À planifier</option>
              <option>En cours</option>
              <option>Terminée</option>
              <option>À corriger</option>
              <option>Validée</option>
            </select>
          </div>

        </div>

      </form>
    </div>

    <div id="rubriquesVisite"></div>

    <div class="card">
      <h2>Informations diverses</h2>

      <textarea
        id="informations"
        placeholder="Commentaires et remarques diverses"
      ></textarea>
    </div>

    <div class="card">
      <h2>Actions prioritaires</h2>

      <div class="grid">

        <div>
          <label for="action1">Action</label>
          <input type="text" id="action1">
        </div>

        <div>
          <label for="responsableAction1">Responsable</label>
          <input type="text" id="responsableAction1">
        </div>

        <div>
          <label for="echeance1">Échéance</label>
          <input type="date" id="echeance1">
        </div>

        <div>
          <label for="statutAction1">Statut</label>

          <select id="statutAction1">
            <option>À planifier</option>
            <option>En cours</option>
            <option>Terminée</option>
          </select>
        </div>

      </div>
    </div>

    <div class="card">

      <div class="resultat">
        Taux de conformité :
        <span id="tauxConformite">0 %</span>
      </div>

      <div class="actions">

        <button type="button" onclick="calculerConformite()">
          Calculer la conformité
        </button>

        <button
          type="button"
          class="success"
          onclick="enregistrerVisite()"
        >
          Enregistrer la visite
        </button>

        <button
          type="button"
          class="secondary"
          onclick="window.print()"
        >
          Imprimer / PDF
        </button>

        <button
          type="button"
          class="secondary"
          onclick="retourDashboard()"
        >
          Retour au tableau de bord
        </button>

      </div>

    </div>

  </section>

</main>

<script>
  const utilisateur = JSON.parse(
    localStorage.getItem("utilisateurConnecte")
  );

  if (!utilisateur) {
    window.location.href = "index.html";
  }

  const magasins = [
    ["005", "CHERBOURG"],
    ["008", "TOURS CHAMBRAY II"],
    ["009", "CHANTEPIE"],
    ["012", "ANGERS"],
    ["023", "VINEUIL"],
    ["028", "ST ET.D.ROUVRAY"],
    ["051", "ORLEANS SARAN"],
    ["053", "LANESTER"],
    ["087", "VANNES PLOEREN"],
    ["095", "MONTGERMONT"],
    ["098", "LAVAL"],
    ["100", "QUIMPER"],
    ["106", "BARENTIN"],
    ["121", "MONDEVILLE ETOILE"],
    ["123", "LANGUEUX"],
    ["139", "LE MANS-CLEMENCEAU"],
    ["159", "GONFREVILLE"],
    ["173", "BREST GOUESNOU"],
    ["188", "CHARTRES"],
    ["201", "DIEPPE"],
    ["217", "LANNION"],
    ["218", "ST MALO"],
    ["222", "EVREUX"],
    ["237", "ORLEANS"]
  ];

  const configurations = {
    DR: {
      titre: "Tableau de bord global - Direction Régionale",
      visite: "Visite DR - Visite globale",

      rubriques: {
        "Tenue du magasin": [
          "Extérieur du magasin",
          "Tenue générale du magasin",
          "Affichage et communication",
          "Zone de mise en avant"
        ],
        "Process": [
          "Respect des procédures internes",
          "Suivi des indicateurs",
          "Organisation des rituels",
          "Qualité du reporting"
        ],
        "Dette magasin": [
          "Suivi de la dette",
          "Actions engagées",
          "Respect des échéances"
        ],
        "Qualité": [
          "Qualité de l'accueil",
          "Qualité de la vente",
          "Qualité de la pose",
          "Satisfaction client"
        ]
      }
    },

    ROV: {
      titre: "Tableau de bord Vente - ROV",
      visite: "Visite ROV - Tournée vente",

      rubriques: {
        "Priorités commerciales": [
          "PEC",
          "Lead J1 / J3",
          "Produits BESTS",
          "CA Carrelage",
          "Avis Google",
          "CA Commerce",
          "CA Pose",
          "Transformation",
          "Concrétisation des devis",
          "Marge",
          "GAG"
        ],
        "Compétences commerciales": [
          "Maîtrise de la vente - RM / ARM",
          "Maîtrise de la vente - Vendeurs",
          "Budget demandé à chaque client",
          "Dossiers complets dans POS",
          "Prochain rendez-vous notifié",
          "Commentaires sur chaque devis",
          "Maîtrise du CRM"
        ],
        "Rituels": [
          "Brief quotidien",
          "Réunion hebdomadaire",
          "Animation CRM hebdomadaire",
          "Feuille de route mensuelle"
        ],
        "Sécurité et conformité": [
          "Tenue du magasin",
          "Affichage des prix",
          "Respect des CGV",
          "Paiement",
          "EPI"
        ]
      }
    },

    RSR: {
      titre: "Tableau de bord Pose et Service - RSR",
      visite: "Visite RSR - Tournée pose et service",

      rubriques: {
        "Pose": [
          "Planning de pose à jour",
          "Suivi des chantiers",
          "Qualité des poses",
          "Respect des délais",
          "Réception des chantiers"
        ],
        "Service client": [
          "Traitement des réclamations",
          "Suivi des réserves",
          "Relance des clients",
          "Satisfaction client"
        ],
        "Process": [
          "Dossiers chantiers complets",
          "Signature des documents",
          "Contrôle des références",
          "Suivi des remises et avoirs"
        ],
        "Sécurité": [
          "Port des EPI",
          "Sécurité des zones de travail",
          "Respect des consignes"
        ]
      }
    },

    RRH: {
      titre: "Tableau de bord Ressources Humaines - RRH",
      visite: "Visite RRH - Tournée RH",

      rubriques: {
        "Équipe": [
          "Organigramme à jour",
          "Effectif conforme",
          "Intégration des nouveaux collaborateurs",
          "Suivi des absences"
        ],
        "Management": [
          "Entretiens réalisés",
          "Points individuels réalisés",
          "Suivi des compétences",
          "Plan de développement"
        ],
        "Organisation": [
          "Planning à jour",
          "Rituels managériaux",
          "Communication interne",
          "Climat social"
        ],
        "Sécurité et conformité RH": [
          "Affichages obligatoires",
          "Documents collaborateurs",
          "Formation sécurité",
          "Respect des règles internes"
        ]
      }
    }
  };

  const configuration =
    configurations[utilisateur.role] || configurations.DR;

  document.getElementById("utilisateurConnecte").textContent =
    utilisateur.nom + " - " + utilisateur.role;

  document.getElementById("titreDashboard").textContent =
    configuration.titre;

  function chargerMagasins() {
    const select = document.getElementById("magasin");

    select.innerHTML =
      '<option value="">Sélectionner un magasin</option>';

    magasins.forEach(function(magasin) {
      const option = document.createElement("option");

      option.value = magasin[0] + " - " + magasin[1];
      option.textContent = magasin[0] + " - " + magasin[1];

      select.appendChild(option);
    });
  }

  function appliquerCouleurEvaluation(select) {
    select.classList.remove(
      "evaluation-ok",
      "evaluation-partiel",
      "evaluation-non",
      "evaluation-ne"
    );

    if (select.value === "OK") {
      select.classList.add("evaluation-ok");
    }

    if (select.value === "PARTIEL") {
      select.classList.add("evaluation-partiel");
    }

    if (select.value === "NON") {
      select.classList.add("evaluation-non");
    }

    if (select.value === "NE") {
      select.classList.add("evaluation-ne");
    }
  }

  function obtenirClasseBadge(evaluation) {
    if (evaluation === "OK") return "badge-ok";
    if (evaluation === "PARTIEL") return "badge-partiel";
    if (evaluation === "NON") return "badge-non";
    return "badge-ne";
  }

  function obtenirLibelleEvaluation(evaluation) {
    if (evaluation === "OK") return "OK";
    if (evaluation === "PARTIEL") return "Partiel";
    if (evaluation === "NON") return "Non conforme";
    return "Non évalué";
  }

  function afficherRubriques() {
    const zone = document.getElementById("rubriquesVisite");

    zone.innerHTML = "";

    Object.entries(configuration.rubriques).forEach(
      function([nom, controles]) {
        const section = document.createElement("div");

        section.className = "card";
        section.innerHTML = `<h2>${nom}</h2>`;

        controles.forEach(function(controle) {
          section.innerHTML += `
            <div class="controle">
              <strong>${controle}</strong>

              <select class="evaluation">
                <option value="">Évaluer</option>
                <option value="OK">OK</option>
                <option value="PARTIEL">Partiel</option>
                <option value="NON">Non conforme</option>
                <option value="NE">Non évalué</option>
              </select>

              <input
                type="text"
                class="commentaire"
                placeholder="Commentaire"
              >
            </div>
          `;
        });

        zone.appendChild(section);
      }
    );

    document.querySelectorAll(".evaluation").forEach(function(select) {
      select.addEventListener("change", function() {
        appliquerCouleurEvaluation(select);
        calculerConformite();
      });
    });
  }

  function afficherPageVisite() {
    document.getElementById("pageDashboard").style.display = "none";
    document.getElementById("pageVisite").style.display = "block";

    document.getElementById("titreVisite").textContent =
      configuration.visite;

    document.getElementById("date").value =
      new Date().toISOString().split("T")[0];

    document.getElementById("visiteur").value =
      utilisateur.nom;

    chargerMagasins();
    afficherRubriques();

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }

  function retourDashboard() {
    document.getElementById("pageVisite").style.display = "none";
    document.getElementById("pageDashboard").style.display = "block";

    actualiserDashboard();

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }

  function calculerConformite() {
    const evaluations =
      document.querySelectorAll(".evaluation");

    let total = 0;
    let conformes = 0;

    evaluations.forEach(function(evaluation) {
      if (
        evaluation.value === "OK" ||
        evaluation.value === "PARTIEL" ||
        evaluation.value === "NON"
      ) {
        total++;
      }

      if (evaluation.value === "OK") {
        conformes++;
      }
    });

    const taux = total === 0
      ? 0
      : Math.round((conformes / total) * 100);

    document.getElementById("tauxConformite").textContent =
      taux + " %";

    return taux;
  }

  function enregistrerVisite() {
    const magasin =
      document.getElementById("magasin").value;

    const date =
      document.getElementById("date").value;

    if (!magasin || !date) {
      alert("Veuillez sélectionner un magasin et une date.");
      return;
    }

    const evaluations = [];

    document.querySelectorAll(".controle").forEach(function(controle) {
      const evaluation =
        controle.querySelector(".evaluation").value;

      evaluations.push({
        intitule: controle.querySelector("strong").textContent,
        evaluation: evaluation,
        commentaire: controle.querySelector(".commentaire").value
      });
    });

    const visite = {
      id: Date.now(),
      role: utilisateur.role,
      visiteur: document.getElementById("visiteur").value,
      type: configuration.visite,
      magasin: magasin,
      date: date,
      responsable: document.getElementById("responsable").value,
      statut: document.getElementById("statut").value,
      tauxConformite: calculerConformite(),
      informations: document.getElementById("informations").value,
      action: document.getElementById("action1").value,
      responsableAction:
        document.getElementById("responsableAction1").value,
      echeance: document.getElementById("echeance1").value,
      statutAction: document.getElementById("statutAction1").value,
      evaluations: evaluations,
      dateEnregistrement: new Date().toISOString()
    };

    const visites = JSON.parse(
      localStorage.getItem("visites") || "[]"
    );

    visites.push(visite);

    localStorage.setItem(
      "visites",
      JSON.stringify(visites)
    );

    alert("La visite a été enregistrée avec succès.");

    document.getElementById("visiteForm").reset();
    document.getElementById("rubriquesVisite").innerHTML = "";
    document.getElementById("tauxConformite").textContent = "0 %";

    retourDashboard();
  }

  function actualiserDashboard() {
    const visites = JSON.parse(
      localStorage.getItem("visites") || "[]"
    );

    const visitesRole = utilisateur.role === "DR"
      ? visites
      : visites.filter(function(visite) {
          return visite.role === utilisateur.role;
        });

    const terminees = visitesRole.filter(function(visite) {
      return visite.statut === "Terminée" ||
             visite.statut === "Validée";
    });

    const anomalies = visitesRole.filter(function(visite) {
      return visite.statut === "À corriger";
    });

    const moyenne = visitesRole.length === 0
      ? 0
      : Math.round(
          visitesRole.reduce(function(total, visite) {
            return total + Number(visite.tauxConformite || 0);
          }, 0) / visitesRole.length
        );

    document.getElementById("nombreVisites").textContent =
      visitesRole.length;

    document.getElementById("visitesTerminees").textContent =
      terminees.length;

    document.getElementById("anomalies").textContent =
      anomalies.length;

    document.getElementById("tauxGlobal").textContent =
      moyenne + " %";

    const liste =
      document.getElementById("listeVisites");

    if (visitesRole.length === 0) {
      liste.innerHTML = "Aucune visite enregistrée.";
      return;
    }

    liste.innerHTML = "";

    visitesRole
      .slice()
      .sort(function(a, b) {
        return new Date(b.date) - new Date(a.date);
      })
      .slice(0, 10)
      .forEach(function(visite) {

        let detailsEvaluations = "";

        if (visite.evaluations) {
          detailsEvaluations = visite.evaluations
            .filter(function(item) {
              return item.evaluation;
            })
            .map(function(item) {
              return `
                <div>
                  ${item.intitule} :
                  <span class="badge ${obtenirClasseBadge(item.evaluation)}">
                    ${obtenirLibelleEvaluation(item.evaluation)}
                  </span>
                </div>
              `;
            })
            .join("");
        }

        liste.innerHTML += `
          <div class="visite-liste">
            <strong>${visite.type}</strong><br>
            <b>Magasin :</b> ${visite.magasin}<br>
            <b>Date :</b> ${visite.date}<br>
            <b>Visiteur :</b> ${visite.visiteur}<br>
            <b>Statut :</b> ${visite.statut}<br>
            <b>Conformité :</b> ${visite.tauxConformite} %

            ${
              detailsEvaluations
                ? `<hr><b>Évaluations :</b>${detailsEvaluations}`
                : ""
            }
          </div>
        `;
      });
  }

  function deconnexion() {
    localStorage.removeItem("utilisateurConnecte");
    window.location.href = "index.html";
  }

  actualiserDashboard();
</script>

</body>
</html>
